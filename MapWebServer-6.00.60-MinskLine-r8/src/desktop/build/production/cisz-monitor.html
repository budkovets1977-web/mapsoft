<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг отправки в ЦИСЗ</title>
<link rel="icon" href="favicon.ico?v=102" type="image/x-icon">
<style>
:root {
    --bg: #f0f4f8; --card: #ffffff; --ink: #16243a; --ink2: #476b8f;
    --line: #dde8f4; --accent: #1873c6; --ok: #1d8a4e; --err: #c62828;
    --wait: #b26a00; --cancel: #6b7280; --head: #0b2545;
}
* { box-sizing: border-box; }
body {
    margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
}
header {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(90deg, var(--head), #14406e);
    color: #fff; padding: 10px 18px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
header h1 { font-size: 17px; margin: 0; font-weight: 700; }
header .meta { font-size: 12.5px; opacity: .85; }
header .spacer { flex: 1; }
#state { font-size: 12.5px; padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,.15); }
#state.err { background: #b3261e; }
#state.off { background: #6b7280; }
#todaybadge {
    font-size: 14px; padding: 5px 14px; border-radius: 14px;
    background: #ffffff; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
#todaybadge b { font-size: 17px; color: #0b2545; font-variant-numeric: tabular-nums; }
.hbtn {
    display: inline-block; font-size: 12.5px; padding: 5px 14px; border-radius: 12px;
    background: #ffffff; color: var(--head); font-weight: 600; text-decoration: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.hbtn:hover { filter: brightness(.95); }
main { padding: 14px 18px 40px; }
.controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.controls input[type=date] {
    font: inherit; padding: 4px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff;
}
.controls label { font-size: 13px; color: var(--ink2); }
.controls button {
    font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 4px 12px; cursor: pointer; color: var(--ink2);
}
.controls button:hover { background: #e7f1fb; border-color: var(--accent); color: var(--accent); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th.sortable .arrow { font-size: 10px; margin-left: 4px; }
.userblock {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(11,37,69,.06);
}
.userblock > .uhead {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 9px 14px; background: #eef4fa; border-bottom: 1px solid var(--line);
}
.userblock > .uhead .uname { font-weight: 700; font-size: 15px; }
.userblock > .uhead .ucount {
    margin-left: auto; background: var(--accent); color: #fff;
    border-radius: 14px; padding: 2px 12px; font-weight: 700; font-size: 13px;
    white-space: nowrap;
}
table { width: 100%; border-collapse: collapse; }
th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink2); padding: 8px 14px; border-bottom: 2px solid var(--accent);
    background: #fafcff; white-space: nowrap; vertical-align: middle;
}
td { padding: 8px 14px; border-bottom: 1.5px solid #9fc2e0; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) td { background: #f4f9fe; }
tbody tr:hover td { background: #e9f3fd; }
tr.fresh td { animation: fresh 6s ease-out; }
@keyframes fresh {
    0% { background: #ffe28a; }
    100% { background: transparent; }
}
.st { display: inline-block; padding: 1px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.st.wait    { background: #fff3cd; color: var(--wait); }
.st.ok      { background: #e2f4e8; color: var(--ok); }
.st.err     { background: #fdecea; color: var(--err); }
.st.cancel  { background: #eceff3; color: var(--cancel); }
.time { color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#msg { max-width: 760px; margin: 60px auto; text-align: center; font-size: 15px; color: var(--ink2); }
#msg b { color: var(--ink); }
#total {
    position: fixed; right: 18px; bottom: 14px; background: var(--head); color: #fff;
    border-radius: 10px; padding: 8px 16px; font-size: 13px; box-shadow: 0 2px 10px rgba(11,37,69,.35);
}
#total b { font-size: 16px; }
td.c, th.c { text-align: center; font-variant-numeric: tabular-nums; vertical-align: middle; }
td.strong { font-weight: 700; }
td.err-cell { color: var(--err); font-weight: 600; }
td.uname-cell { font-weight: 600; }
#loginbox { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 10; }
#loginbox[hidden] { display: none; }
.login-card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px;
    width: 360px; box-shadow: 0 6px 30px rgba(11,37,69,.12);
}
.login-card h2 { margin: 0 0 18px; font-size: 19px; color: var(--head); }
.login-card .fld { margin-bottom: 14px; }
.login-card label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin-bottom: 4px; font-weight: 600; }
.login-card input:not([type=checkbox]) {
    width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #f8fbff;
}
.login-card input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.login-card .rem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); text-transform: none; letter-spacing: 0; font-weight: 400; margin: 4px 0 14px; }
#lbtn {
    width: 100%; font: inherit; font-weight: 700; padding: 11px; border: 0; border-radius: 10px;
    background: linear-gradient(90deg, var(--head), #14406e); color: #fff; cursor: pointer;
}
#lbtn:hover { filter: brightness(1.15); }
#lerr { background: #fdecea; color: var(--err); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.login-card .hint { font-size: 12px; color: var(--ink2); margin: 16px 0 0; line-height: 1.4; }
</style>
</head>
<body>
<header>
    <h1>Мониторинг отправки в ЦИСЗ</h1>
    <span class="meta" id="who"></span>
    <span class="spacer"></span>
    <span class="meta">Обновлено: <span id="upd">—</span></span>
    <span id="state">подключение…</span>
    <span id="todaybadge" hidden>Отправлено сегодня: <b id="todaynum">0</b></span>
    <a class="hbtn" id="userslink" href="cisz-users.html" title="Отчёт об активных пользователях МИС">Активные пользователи</a>
</header>
<main>
    <div class="controls">
        <label>Дата: <input type="date" id="date"></label>
        <button type="button" id="prevday" title="Предыдущий день">◀ День назад</button>
        <button type="button" id="todaybtn" title="Вернуться к сегодняшнему дню">Сегодня</button>
        <label><input type="checkbox" id="autorefresh" checked> автообновление (15 с)</label>
    </div>
    <div id="content"></div>
    <div id="msg" hidden></div>
    <div id="loginbox" hidden>
        <div class="login-card">
            <h2>Вход в мониторинг ЦИСЗ</h2>
            <div class="fld"><label>Логин</label><input id="luser" autocomplete="username"></div>
            <div class="fld"><label>Пароль</label><input id="lpass" type="password" autocomplete="current-password"></div>
            <label class="rem"><input type="checkbox" id="lremember"> Запомнить пароль на этом компьютере</label>
            <div id="lerr" hidden></div>
            <button id="lbtn">Войти</button>
            <p class="hint">Используются те же логин и пароль, что и в МИС. Доступ — по разрешению «Мониторинг ЦИСЗ» (выдаётся в Администрировании → Роли).</p>
        </div>
    </div>
    <div id="total" hidden></div>
</main>
<script>
'use strict';
const SERVICE = '/service/app/med/cisz/monitor.php';
const LOGIN_SERVICE = '/service/common/config';
const LOGIN_SERVICE2 = '/service/common/login';
const STATUS = {
    1: { text: 'Отправляется…', cls: 'wait'   },
    2: { text: 'В обработке',    cls: 'wait'   },
    3: { text: 'Успешно',        cls: 'ok'     },
    4: { text: 'Ошибка',         cls: 'err'    },
    5: { text: 'Отменено',       cls: 'cancel' }
};
function statusOf(it) {
    // Подтверждённый результат приходит отдельной записью проверки статуса.
    // Если её ещё нет, но ответ ЦИСЗ получен — отправка в ожидании подтверждения.
    if (it.result) return STATUS[it.result] || STATUS[1];
    return it.responseTime ? { text: 'Ожидает подтверждения', cls: 'wait' } : STATUS[1];
}
const POLL_MS = 15000;

const $date = document.getElementById('date');
const $content = document.getElementById('content');
const $msg = document.getElementById('msg');
const $state = document.getElementById('state');
const $upd = document.getElementById('upd');
const $who = document.getElementById('who');
const $auto = document.getElementById('autorefresh');
const $total = document.getElementById('total');
const $totalnum = document.getElementById('totalnum');
const $todaybadge = document.getElementById('todaybadge');
const $todaynum = document.getElementById('todaynum');
const $loginbox = document.getElementById('loginbox');

$date.value = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD

let knownIds = new Set();
let initialized = false;
let sortKey = '';      // 'total' | 'monthTotal' | ''
let sortAsc = true;    // по умолчанию — по возрастанию
let lastItems = null;  // последние полученные данные (для сортировки без запроса)
let allowed = null;
let timer = null;
let session = null; // id сессии МИС (получается при входе)

// сессия может быть передана в URL: cisz-monitor.html?session=...
(function () {
    const m = location.search.match(/[?&]session=([a-f0-9]+)/i);
    if (m) { session = m[1]; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
})();

function saveLogin(user, pass, remember) {
    try {
        if (remember) {
            localStorage.setItem('ciszmon-login', btoa(unescape(encodeURIComponent(user))));
            localStorage.setItem('ciszmon-pass', btoa(unescape(encodeURIComponent(pass))));
        } else {
            localStorage.removeItem('ciszmon-login');
            localStorage.removeItem('ciszmon-pass');
        }
    } catch (e) {}
}
function loadLogin() {
    try {
        const u = localStorage.getItem('ciszmon-login'), p = localStorage.getItem('ciszmon-pass');
        return (u && p) ? { user: decodeURIComponent(escape(atob(u))), pass: decodeURIComponent(escape(atob(p))) } : null;
    } catch (e) { return null; }
}

async function misLogin(user, pass) {
    // 1. создать сессию
    let r = await fetch(LOGIN_SERVICE, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'createSession', params: {} })
    });
    const created = (await r.json()).result;
    session = created.session;
    // 2. выбрать конфигурацию (первая с подключением)
    const cfgName = created.settings && created.settings.configTitle ? null : null;
    await fetch(LOGIN_SERVICE + '?session=' + session + '&config=mis', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'check', params: { needVersions: false } })
    });
    // 3. организация
    r = await fetch(LOGIN_SERVICE2 + '?session=' + session, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 3, method: 'readCustomers', params: [] })
    });
    const cj = await r.json();
    if (cj.error) throw new Error(cj.error.message || 'Ошибка чтения организаций');
    const customerId = (cj.result && cj.result[0] && cj.result[0].id) || 1;
    // 4. вход
    r = await fetch(LOGIN_SERVICE2 + '?session=' + session, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 4, method: 'login', params: [user, pass, customerId] })
    });
    const lj = await r.json();
    if (lj.error) throw Object.assign(new Error(lj.error.message || 'Ошибка входа'), { loginError: true });
    return lj.result;
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
    if (!iso) return '—';
    const m = String(iso).match(/(\d{2}:\d{2}:\d{2})/);
    return m ? m[1] : String(iso);
}

async function rpc(method, params) {
    const url = SERVICE + (session ? '?session=' + session : '');
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'session': session || '' },
        credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params: params || {} })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw data.error;
    return data.result;
}

function setState(text, cls) {
    $state.textContent = text;
    $state.className = cls || '';
}

function showMessage(html) {
    $msg.innerHTML = html;
    $msg.hidden = false;
    $content.hidden = true;
    $total.hidden = true;
}

function render(items) {
    if (!items.length) {
        showMessage('За этот день отправок в ЦИСЗ не было.');
        return;
    }
    $msg.hidden = true;
    $content.hidden = false;

    // сводная таблица: одна строка на пользователя
    // columns: Пользователь | Дата | Первый пакет | Обновлено | Всего пакетов | Всего с начала месяца
    const nowKnown = new Set(items.map(it => it.userId));
    let totalPacks = 0;
    const arrow = k => sortKey === k ? '<span class="arrow">' + (sortAsc ? '▲' : '▼') + '</span>' : '';
    if (sortKey) {
        items = items.slice().sort((a, b) => {
            const va = Number(a[sortKey]) || 0, vb = Number(b[sortKey]) || 0;
            return sortAsc ? va - vb : vb - va;
        });
    }
    let html = '<section class="userblock"><table><thead><tr>' +
        '<th>Пользователь</th><th>Дата</th><th>Первый пакет</th><th>Обновлено</th>' +
        '<th class="sortable" data-sort="total" title="Сортировать по возрастанию/убыванию">Всего пакетов' + arrow('total') + '</th>' +
        '<th class="sortable" data-sort="monthTotal" title="Сортировать по возрастанию/убыванию">Всего с начала месяца' + arrow('monthTotal') + '</th>' +
        '</tr></thead><tbody>';
    for (const it of items) {
        totalPacks += Number(it.total) || 0;
        const fresh = initialized && !knownIds.has(it.userId);
        nowKnown.add(it.userId);
        html += `<tr${fresh ? ' class="fresh"' : ''}>` +
            `<td class="uname-cell">${esc(it.userName || '—')}</td>` +
            `<td class="c">${esc(it.date || $date.value)}</td>` +
            `<td class="c">${esc(it.firstSend || '—')}</td>` +
            `<td class="c">${esc(it.lastActivity || '—')}</td>` +
            `<td class="c strong">${Number(it.total) || 0}</td>` +
            `<td class="c">${Number(it.monthTotal) || 0}</td>` +
            `</tr>`;
    }
    knownIds = nowKnown;

    html += '</tbody></table></section>';
    $content.innerHTML = html;
    // клик по сортируемым заголовкам: первый клик — по возрастанию, повторный — по убыванию
    $content.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
            const k = th.getAttribute('data-sort');
            if (sortKey === k) { sortAsc = !sortAsc; } else { sortKey = k; sortAsc = true; }
            if (lastItems) render(lastItems);
        });
    });
    initialized = true;
}

function showLogin(errorText) {
    stopPolling();
    $msg.hidden = true;
    $content.hidden = true;
    $total.hidden = true;
    $loginbox.hidden = false;
    $state.textContent = 'не авторизован';
    $state.className = 'off';
    const err = document.getElementById('lerr');
    if (errorText) { err.textContent = errorText; err.hidden = false; } else { err.hidden = true; }
    const saved = loadLogin();
    document.getElementById('luser').value = saved ? saved.user : '';
    document.getElementById('lpass').value = saved ? saved.pass : '';
    document.getElementById('lremember').checked = !!saved;
}

async function doLogin() {
    const user = document.getElementById('luser').value.trim();
    const pass = document.getElementById('lpass').value;
    const remember = document.getElementById('lremember').checked;
    if (!user || !pass) { showLogin('Введите логин и пароль'); return; }
    const btn = document.getElementById('lbtn');
    btn.disabled = true; btn.textContent = 'Вход…';
    try {
        const result = await misLogin(user, pass);
        saveLogin(user, pass, remember);
        $who.textContent = (result.user && result.user.name) ? ('Пользователь: ' + result.user.name) : '';
        $loginbox.hidden = true;
        // проверяем право доступа
        const me = await rpc('whoAmI');
        if (!me.allowed) {
            setState('нет доступа', 'err');
            showMessage('<b>Нет доступа.</b><br>Мониторинг ЦИСЗ доступен по разрешению ' +
                '<b>«Мониторинг ЦИСЗ»</b> (Администрирование → Медицина).<br>' +
                'Обратитесь к администратору системы.');
            return;
        }
        startPolling();
    } catch (e) {
        showLogin((e && e.message) ? e.message : 'Ошибка входа');
    } finally {
        btn.disabled = false; btn.textContent = 'Войти';
    }
}

async function init() {
    document.getElementById('lbtn').onclick = doLogin;
    document.getElementById('lpass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    document.getElementById('luser').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

    if (session) {
        // сессия передана в URL (например, из МИС) — проверяем её
        try {
            const me = await rpc('whoAmI');
            if (me.allowed) {
                $who.textContent = me.userName ? ('Пользователь: ' + me.userName + (me.isAdmin ? ' (администратор)' : '')) : '';
                startPolling();
                return;
            }
            if (me.needLogin) { session = null; showLogin(); return; }
            setState('нет доступа', 'err');
            showMessage('<b>Нет доступа.</b><br>Мониторинг ЦИСЗ доступен по разрешению ' +
                '<b>«Мониторинг ЦИСЗ»</b> (Администрирование → Медицина).<br>' +
                'Обратитесь к администратору системы.');
            return;
        } catch (e) { session = null; }
    }
    // пробуем сохранённый вход
    const saved = loadLogin();
    if (saved && saved.user && saved.pass) {
        try {
            const result = await misLogin(saved.user, saved.pass);
            $who.textContent = (result.user && result.user.name) ? ('Пользователь: ' + result.user.name) : '';
            const me = await rpc('whoAmI');
            if (me.allowed) { startPolling(); return; }
            setState('нет доступа', 'err');
            showMessage('<b>Нет доступа.</b><br>Мониторинг ЦИСЗ доступен по разрешению ' +
                '<b>«Мониторинг ЦИСЗ»</b> (Администрирование → Медицина).');
            return;
        } catch (e) { /* сохранённый вход не сработал — показываем форму */ }
    }
    showLogin();
}

async function poll() {
    if (!$auto.checked) return;
    try {
        setState('обновление…');
        const data = await rpc('readSummary', { date: $date.value });

        // виджет «Отправлено сегодня» — обновляется каждым опросом
        if (typeof data.todayTotal === 'number') {
            $todaybadge.hidden = false;
            $todaynum.textContent = data.todayTotal;
        }
        setState('онлайн', '');
        $upd.textContent = data.serverTime ? fmtTime(data.serverTime) : new Date().toLocaleTimeString('ru-RU');
        lastItems = data.items || [];
        render(lastItems);
    } catch (e) {
        if (e && (e.code === -401 || /вход|сессия/i.test(e.message || ''))) {
            session = null;
            showLogin('Сессия истекла, войдите заново');
        } else if (e && (e.code === -1 || /доступ/i.test(e.message || ''))) {
            setState('нет доступа', 'err');
            showMessage('<b>Нет доступа.</b><br>Мониторинг ЦИСЗ доступен по разрешению ' +
                '<b>«Мониторинг ЦИСЗ»</b> (Администрирование → Медицина).<br>' +
                'Обратитесь к администратору системы.');
            stopPolling();
        } else {
            setState('нет связи', 'err');
            $upd.textContent = '—';
        }
    }
}

function startPolling() {
    stopPolling();
    poll();
    timer = setInterval(poll, POLL_MS);
}
function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }

$date.onchange = () => { knownIds = new Set(); initialized = false; poll(); };
$auto.onchange = () => $auto.checked ? startPolling() : stopPolling();

// навигация по дням: результаты за прошлые дни
function shiftDate(days) {
    const d = new Date($date.value + 'T00:00:00');
    if (isNaN(d)) return;
    d.setDate(d.getDate() + days);
    $date.value = d.toLocaleDateString('sv-SE'); // YYYY-MM-DD
    $date.onchange();
}
document.getElementById('prevday').onclick = () => shiftDate(-1);
document.getElementById('todaybtn').onclick = () => {
    $date.value = new Date().toLocaleDateString('sv-SE');
    $date.onchange();
};

init();
</script>
</body>
</html>
