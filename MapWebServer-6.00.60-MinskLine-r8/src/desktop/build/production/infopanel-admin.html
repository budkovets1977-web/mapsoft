<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройка информационной панели</title>
<style>
:root {
    --bg: #eef2f7; --ink: #16243a; --ink2: #476b8f;
    --accent: #0b2545; --line: #dde8f4; --err: #b3261e;
}
* { box-sizing: border-box; }
body {
    margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column;
}
header {
    background: linear-gradient(135deg, #0b2545, #13315c);
    color: #fff; padding: 12px 22px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .meta { font-size: 12.5px; opacity: .85; }
header .spacer { flex: 1; }
#state { font-size: 12.5px; padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,.15); }
#state.err { background: #b3261e; }
#state.off { background: #6b7280; }
main { flex: 1; padding: 18px 22px 40px; }
#msg {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin: 0 auto; max-width: 720px; color: var(--ink2);
}
#msg b { color: var(--ink); }
.card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 26px; max-width: 720px; margin: 0 auto;
    box-shadow: 0 1px 4px rgba(11,37,69,.06);
}
.card h2 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
.card .sub { color: var(--ink2); font-size: 13px; margin-bottom: 18px; }
.fld { margin-bottom: 14px; }
.fld label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
.fld input {
    width: 100%; font: inherit; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
}
.rem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); margin: 4px 0 16px; }
#lbtn {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer;
}
#lbtn:hover { filter: brightness(1.15); }
#lerr { background: #fdecea; color: var(--err); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.hint { font-size: 12px; color: var(--ink2); margin: 16px 0 0; line-height: 1.4; }
#toolbar { display: none; gap: 10px; margin: 0 auto 14px; max-width: 1080px; flex-wrap: wrap; }
#toolbar button {
    font: inherit; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 6px 14px; cursor: pointer;
}
#toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
#host {
    display: none; background: #fff; border: 1px solid var(--line); border-radius: 12px;
    max-width: 1080px; margin: 0 auto; min-height: 620px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(11,37,69,.06);
}
.loading { text-align: center; color: var(--ink2); padding: 40px 0; }
</style>
</head>
<body>
<header>
    <h1>Настройка информационной панели</h1>
    <span class="meta" id="who"></span>
    <span class="spacer"></span>
    <span id="state">подключение…</span>
</header>
<main>
    <div id="loginbox" hidden>
        <div class="card">
            <h2>Вход в систему</h2>
            <div class="sub">Управление панелями холла (infopanel): создание панелей, сегментов, параметры обновления.</div>
            <div class="fld"><label>Логин</label><input id="luser" autocomplete="username"></div>
            <div class="fld"><label>Пароль</label><input id="lpass" type="password" autocomplete="current-password"></div>
            <label class="rem"><input type="checkbox" id="lremember"> Запомнить пароль на этом компьютере</label>
            <div id="lerr" hidden></div>
            <button id="lbtn">Войти</button>
            <p class="hint">Используются те же логин и пароль, что и в МИС. Нужны права на «Настройку информационной панели» (map-infopanel-settings).</p>
        </div>
    </div>
    <div id="msg" hidden></div>
    <div id="toolbar">
        <button class="primary" id="btnOpen">Открыть настройки панелей</button>
        <button id="btnTv">Табло (проверка)</button>
    </div>
</main>
<script>
'use strict';
const LOGIN_SERVICE = '/service/common/config';
const LOGIN_SERVICE2 = '/service/common/login';
const THEME = 'maptheme-ru';

const $state = document.getElementById('state');
const $who = document.getElementById('who');
const $loginbox = document.getElementById('loginbox');
const $msg = document.getElementById('msg');
const $toolbar = document.getElementById('toolbar');
const $host = document.getElementById('host');
const $lerr = document.getElementById('lerr');

let session = null;

function setState(text, cls) { $state.textContent = text; $state.className = cls || ''; }

function saveLogin(user, pass, remember) {
    try {
        if (remember) {
            localStorage.setItem('ipadmin-login', btoa(unescape(encodeURIComponent(user))));
            localStorage.setItem('ipadmin-pass', btoa(unescape(encodeURIComponent(pass))));
        } else {
            localStorage.removeItem('ipadmin-login');
            localStorage.removeItem('ipadmin-pass');
        }
    } catch (e) {}
}
function loadLogin() {
    try {
        const u = localStorage.getItem('ipadmin-login'), p = localStorage.getItem('ipadmin-pass');
        return (u && p) ? { user: decodeURIComponent(escape(atob(u))), pass: decodeURIComponent(escape(atob(p))) } : null;
    } catch (e) { return null; }
}

// та же последовательность, что в мониторе ЦИСЗ: createSession → check → readCustomers → login (позиционные параметры)
async function misLogin(user, pass) {
    let r = await fetch(LOGIN_SERVICE, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'createSession', params: {} })
    });
    const created = (await r.json()).result;
    session = created.session;
    await fetch(LOGIN_SERVICE + '?session=' + session + '&config=mis', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'check', params: { needVersions: false } })
    });
    r = await fetch(LOGIN_SERVICE2 + '?session=' + session, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 3, method: 'readCustomers', params: [] })
    });
    const cj = await r.json();
    if (cj.error) throw new Error(cj.error.message || 'Ошибка чтения организаций');
    const customerId = (cj.result && cj.result[0] && cj.result[0].id) || 1;
    r = await fetch(LOGIN_SERVICE2 + '?session=' + session, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 4, method: 'login', params: [user, pass, customerId] })
    });
    const lj = await r.json();
    if (lj.error) throw Object.assign(new Error(lj.error.message || 'Ошибка входа'), { loginError: true });
    return lj.result;
}

// загрузка JS-модулей МИС в текущую страницу (ленивые модули infopanel)
function loadScript(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve(src);
        s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
        document.head.appendChild(s);
    });
}

async function checkPermission() {
    const r = await fetch('/service/app/med/cisz/monitor.php?session=' + session, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ jsonrpc: '2.0', id: 10, method: 'whoAmI', params: {} })
    });
    // используем только сессию; право infopanel проверит сам сервис настроек
    return true;
}

async function openSettings() {
    setState('запуск МИС…');
    const url = '/?config=mis&ipadmin=1&session=' + encodeURIComponent(session || '');
    window.open(url, 'infopanel_admin_mis');
    $msg.innerHTML = '<b>МИС открыта в новой вкладке</b> — окно «Настройка информационной панели» откроется в ней автоматически (10–30 секунд).';
    $msg.hidden = false;
    setState('онлайн');
}

function openTv() {
    window.open('/?config=infopanel', 'infopanel_tv');
}

$loginbox.hidden = false;
const saved = loadLogin();
if (saved) {
    document.getElementById('luser').value = saved.user;
    document.getElementById('lpass').value = saved.pass;
    document.getElementById('lremember').checked = true;
}

async function doLogin() {
    const user = document.getElementById('luser').value.trim();
    const pass = document.getElementById('lpass').value;
    const remember = document.getElementById('lremember').checked;
    if (!user || !pass) return;
    $lerr.hidden = true;
    setState('вход…');
    try {
        const me = await misLogin(user, pass);
        saveLogin(user, pass, remember);
        $loginbox.hidden = true;
        $who.textContent = 'Пользователь: ' + ((me.user && me.user.name) || user);
        // Ext уже загружен? нет — загрузим минимальный каркас из темы МИС
        await bootExt();
        $toolbar.style.display = 'flex';
        await openSettings();
    } catch (e) {
        setState('не авторизован', 'off');
        $lerr.textContent = e.message || 'Ошибка входа';
        $lerr.hidden = false;
    }
}
document.getElementById('lbtn').addEventListener('click', doLogin);
document.getElementById('lpass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('btnOpen').addEventListener('click', () => openSettings());
document.getElementById('btnTv').addEventListener('click', openTv);

// Полный Ext-каркас МИС в чужую страницу не загрузить (bootstrap, manifest, Vars).
// Поэтому: открываем штатную МИС в окне (same-origin) и УЖЕ В НЕЙ, из этой страницы,
// догружаем ленивые модули infopanel и открываем окно настройки, когда приложение инициализируется.
async function bootExt() {
    setState('запуск МИС…');
    const child = window.open('/?config=mis', 'infopanel_admin_mis');
    $toolbar.style.display = 'flex';
    $msg.innerHTML = '<b>Открываю МИС…</b> После загрузки приложения (10–30 сек) окно «Настройка информационной панели» откроется само.';
    $msg.hidden = false;
    if (!child) {
        $msg.innerHTML = '<b>Браузер заблокировал всплывающее окно.</b> Разрешите popup для этого сайта и нажмите «Открыть настройки панелей» ещё раз.';
        setState('онлайн');
        return;
    }
    child.focus();
    // ждём инициализации Ext в дочернем окне и грузим модули туда
    const waitApp = setInterval(() => {
        try {
            if (!child.Ext || !child.Ext.ClassManager) return; // приложение ещё грузится
            if (!child.Ext.app || !child.Ext.ApplicationManager) return;
            const appInstances = child.Ext.ApplicationManager.instances;
            if (!appInstances || !Object.keys(appInstances).length) return; // приложение не стартовало
            clearInterval(waitApp);
            injectAndOpen(child);
        } catch (e) { /* cross-doc ещё не готов */ }
    }, 1500);
    setTimeout(() => clearInterval(waitApp), 180000);
}

function injectAndOpen(child) {
    try {
        if (child.__ipWinOpened) return;
        child.__ipWinOpened = true;
        const doc = child.document;
        const load = (src, next) => {
            if (doc.querySelector('script[src*="' + src.split('/').pop() + '"]')) { next(); return; }
            const s = doc.createElement('script');
            s.src = src;
            s.onload = next;
            s.onerror = next;
            doc.head.appendChild(s);
        };
        load('maptheme-ru/app/map/common-model.js', () => {
            load('maptheme-ru/app/map/infopanel-model.js', () => {
                load('maptheme-ru/app/map/infopanel.js', () => {
                    const t = setInterval(() => {
                        try {
                            if (child.Ext.ClassManager.get('Map.infopanel.view.Settings')) {
                                clearInterval(t);
                                child.Ext.create('Map.infopanel.view.Settings').show();
                            }
                        } catch (e) {}
                    }, 800);
                    setTimeout(() => clearInterval(t), 60000);
                });
            });
        });
    } catch (e) { /* ignore */ }
}

// Прямой запуск из адресной строки не предусмотрен: страница-диспетчер сама управляет дочерним окном.
</script>
</body>
</html>
