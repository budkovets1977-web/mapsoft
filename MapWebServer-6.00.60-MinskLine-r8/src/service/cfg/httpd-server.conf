#
# Конфигурация для подключения дополнительных каталогов веб-серверов к
# текущему основному, с доступом через расширение пути URL.
#
# Пример подключения дополнительных каталогов серверов в httpd-custom.conf:
#
# Define SERVER_URL /foo
# Define SERVER_DIR c:/work/foo_server
# Include "${CFG}/httpd-server.conf"
#
# Define SERVER_URL /test
# Define SERVER_DIR c:/work/test
# Include "${CFG}/httpd-server.conf"
#

<IfDefine SERVER_URL>
    Define SERVER_URL "${SERVER_URL}/"
</IfDefine>
<IfDefine !SERVER_URL>
    Define SERVER_URL "/"
</IfDefine>

<Directory ~ "${SERVER_DIR}/(src|help|shared|video)/">
    Options Includes FollowSymLinks
    Require all granted
</Directory>

# backend
AliasMatch "^${SERVER_URL}service/(app|reports|test)/(.+\.\w+)$"    "${SERVER_DIR}/src/service/$1/$2"
AliasMatch "^${SERVER_URL}service/(app|reports|test)/(.+)$"         "${SERVER_DIR}/src/service/$1/$2.php"
AliasMatch "^${SERVER_URL}service/(.+\.\w+)$"                      "${SERVER_DIR}/src/service/app/$1"
AliasMatch "^${SERVER_URL}service/(.+)$"                           "${SERVER_DIR}/src/service/app/$1.php"
AliasMatch "^${SERVER_URL}(help|shared|video)/(.+)$"               "${SERVER_DIR}/$1/$2"

# frontend
Alias ${SERVER_URL}modern/debug    "${SERVER_DIR}/src/modern/"
Alias ${SERVER_URL}modern          "${SERVER_DIR}/src/modern/build/production/app/"
Alias ${SERVER_URL}service         "${SERVER_DIR}/src/service/app/"
Alias ${SERVER_URL}debug           "${SERVER_DIR}/src/desktop/"
Alias ${SERVER_URL}testing         "${SERVER_DIR}/src/desktop/build/testing/"
Alias ${SERVER_URL}                "${SERVER_DIR}/src/desktop/build/production/"

