# Настройка виртуальных хостов в Apache для разграничения доступа к
# приложениям и сервисам по разным портам и/или доменным именам.

# Знак решетки начинает комментарий до конца строки.
# Формат строки настройки (строк может быть несколько):
# ПАРАМЕТРЫ = ЗАДАЧИ

# ПАРАМЕТРЫ это набор слов через разделители (пробел, запятая или точка с запятой)
# определяющие требуемый порт(ы) (числовые значения), протокол для выбранных портов
# и доменные имена, если они необходимы. Порядок не важен. Протокол задается в виде
# одного из зарезервированных слов:"http", "https", "ssl", "tls". Три последних включают
# шифрование и являются синонимами. В каждой строке протокол может быть только один.
# Если нужно несколько портов с разными протоколами, надо добавить другую строку
# с настройкой. Если протокол в строке не указан, то принимается "http". Для портов
# 80 и 443 протокол выбирается автоматически. Доменные имена не являются обязательными
# и их может быть несколько. Если доменные имена отсутствут, то принимаются те что
# указаны в ini.bat в полях ServerName и DomainName. Что именно относится к доменному
# имени в строке определяется наличием точки ".". Доменные имена могут быть не полными,
# а с маской например 192.168.*. Таким образом открыть доступ к веб-серверу с любого
# доменного имени можно написать его в виде ".*", что и указано по умолчанию.

# ЗАДАЧИ список приложений или сервисов доступных по данной настройке. Несколько
# значений перечисляются аналогично параметрам - через пробел, запятую или точка с
# запятой. Названия задач латиницей строго регламентированы и перечисленны в файле
# src\service\app\apps.json. Часть задач таковыми не являются, а просто группы
# настоящих задач, например "med", "buh" (можно указывать как отдельно задачи так
# и группы. Список задач будет пополняться, на текущий момент он следующий:

# * - Все задачи и сервисы без ограничений. Рекомендуется использовать только
#   для отладки.
#-------------------------------------------------------------------------------
# buh - Все бухгалтерские задачи.
# buhservices - Учёт платных услуг.
#-------------------------------------------------------------------------------
# hospital - Медицина (стационар).
# hospitalhistory - История болезни
# hospitalreception - Приёмный покой
#-------------------------------------------------------------------------------
# med - Медицина (поликлиника), включая Администрирование и
#   сервисы связи (ССМП, ПАБ...).
# medadmin - Администрирование (медицина).
# medcard - Амбулаторная карта
# medclinicstats - Статистика поликлиники
# meddayhospital - Дневной стационар
# medexaminations - Диспансеризация, медосмотры
# medfluorography - Флюорокартотека
# medfunctional - Функциональная диагностика
# medlab - Лабораторная диагностика
# medreception - Регистратура
# medrecipes - Льготные рецепты
# medsickday - Учёт временной нетрудоспособности
# medstomatology - Стоматология
# medvaccinations - Иммунопрофилактика
# medxray - Лучевая диагностика
#-------------------------------------------------------------------------------
# equeue - Все задачи электронной очереди.
# equeueapp - Электронная очередь (настройка и управление).
# equeuedisplay - Электронная очередь (вызывное табло).
# equeueorc - Электронная очередь (пульт оператора).
# equeueinfobox - Инфо-киоск электронной очереди.
# equeue_api - Сервис для предоставления данных из базы МАП в сторонние программы
#	электронной очереди (поиск пациентов).
# homevisit - Мобильное приложение Визиты врача на дом.
# inspectrw - Сервис приема медосмотров работников ЖД из поликлиник в базу МАП ЦВЭК
#	(централизованная врачебная экспертная комиссия). МАПы поликлиник передают
#	планировщиком в данный сервис, который синхронизирует в централизованную базу МАП ЦВЭК.
# patientident - Распределение номеров индивидуальных карт медобслуживания.
# service131 - Служба 131 (сервер и веб-приложение для клиентов без комплекса МАП).
# service131_api - Сервис службы 131 для клиентов с комплексом МАП, обеспечивает
# заказ и отмену талонов.
# svodbuh - Сводная бухгалтерская отчетность и ГРС.
# talonbox - Инфо-киоск для заказа талонов и просмотра прейскуранта платных услуг.
# talonby - Сервис обеспечивающий функционал сайта talon.by.
#-------------------------------------------------------------------------------
# mobile - Мобильные приложения
# mobilehospital - Все мобильные приложения стационара
# mobilehospitaldoctor - Врач стационара
# mobilehospitalnurse - Медсестра стационара
#-------------------------------------------------------------------------------

# После изменения параметров, необходим рестарт службы Apache, с помощью команд
# restart.bat или stop/start.bat из корня MapWebServer (НЕ через Службы Windows!).
# Если нет ни одной настройки, все открыто для доступа по данным ini.bat.
# Примеры настроек:

# 8080 8081 mis.work.by, www.mis.work.by = med  # доступ ко всем задачам МИС только через два доменных имени по любому из указанных портов, протокол HTTP
# 8443 ssl = talonby							# доступ сервису talon.by через порт 8443 с протоколом HTTPS по IP ServerName или DomainName указанному в ini.bat
# 443 http svod.work.by = svodbuh          		# здесь протокол все равно будет HTTPS и доступ к Сводной бухотчетности только по доменному имени
# 443 mis.work.by = med equeue					# теперь по HTTPS без порта можно обратится к Сводной бухотчетности, МИС и ЭО, но только указывая свои доменные имена
.* = *                                          # доступ ко всем задачам и сервисам через любое доменное имя и порт указанный указанный в ini.bat
