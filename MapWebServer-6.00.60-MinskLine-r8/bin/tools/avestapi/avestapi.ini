; web-сервер Авест API (c) ЗАО МАПСОФТ
; файл настроек
; считывается при каждом старте сервера

; параметры сервера
[server]
; по-умолчанию используется порт 7944
port=7944

; параметры журналирования
[log]
; если установить параметр extended=1 - в журнал сервера будет выводиться дополнительная информация; по-умолчанию этот параметр 0, т.е. вывод дополнительной информации отключен
extended=0