	DeflateFilterNote Input instream
	DeflateFilterNote Output outstream
	DeflateFilterNote Ratio ratio
	LogFormat '"%r" %{outstream}n/%{instream}n (%{ratio}n%%)' deflate
#	CustomLog "${SRVROOT}/logs/deflate.log" deflate

	<Location />
		AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript application/json application/xml

        # Apache maps ".js" to "text/javascript" (see conf/mime.types), so the
        # line above never matched and every script was sent uncompressed —
        # app.js alone travelled as 2.4 MB. Keep both aliases here.
        AddOutputFilterByType DEFLATE text/javascript text/x-javascript application/ecmascript text/ecmascript

        # JSON-RPC replies from src/service are large; SVG and WOFF/TTF fonts
        # compress well too and are re-read on every page load.
        AddOutputFilterByType DEFLATE image/svg+xml font/woff font/woff2 application/font-woff application/vnd.ms-fontobject

		# Netscape 4.x has some problems...
		BrowserMatch ^Mozilla/4 gzip-only-text/html

		# Netscape 4.06-4.08 have some more problems
		BrowserMatch ^Mozilla/4\.0[678] no-gzip

		# MSIE masquerades as Netscape, but it is fine
		BrowserMatch \bMSIE !no-gzip !gzip-only-text/html

		# Don't compress images and already-compressed archives
		SetEnvIfNoCase Request_URI \
		\.(?:gif|jpe?g|png|webp|zip|rar|7z|gz|pdf)$ no-gzip dont-vary

		<IfModule headers_module>
			# Make sure proxies don't deliver the wrong content
			Header append Vary User-Agent env=!dont-vary
		</IfModule>
	</Location>

<IfModule headers_module>
	# Caching strategy.
	#
	# The ExtJS microloader used to append ?_dc=<Date.now()> to every asset,
	# which changed the URL on each load and made browser caching impossible
	# (app.js was re-downloaded on every F5). The buster is now a build stamp
	# from index.html, so URLs are stable and ETag revalidation kicks in.
	#
	# FilesMatch must live outside <Location> — it is not allowed there.
	#   js/css/svg — always revalidate. Costs one 304 (~200 bytes) instead of
	#                a full 700 KB download, and a redeploy is picked up at once.
	#   fonts     — content-addressed by name, safe to cache for a year.
	#   images    — week is enough; they are re-saved by admins.
	<FilesMatch "\.(js|css|svg)$">
		Header set Cache-Control "public, max-age=0, must-revalidate"
		# Apache appends "-gzip" to the ETag of a compressed body but then
		# only matches the *base* ETag against If-None-Match. A browser echoes
		# back exactly what it received, so every revalidation returned 200 and
		# the full body was re-sent. Dropping the ETag makes the browser fall
		# back to If-Modified-Since, which this server answers with a proper 304.
		Header unset ETag
	</FilesMatch>
	<FilesMatch "\.(woff2?|ttf|otf)$">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</FilesMatch>
	<FilesMatch "\.(png|jpg|jpeg|gif|ico)$">
		Header set Cache-Control "public, max-age=604800"
	</FilesMatch>
</IfModule>
